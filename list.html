<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0a1a3c">
<title>真誓会大宮エリア｜定例会 参加者リスト</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="handout">
<div class="bg-base" aria-hidden="true"></div>
<canvas id="bg" data-bg="calm" aria-hidden="true"></canvas>

<main class="wrap">
  <header class="hero">
    <p class="eyebrow">DIGITAL CONNECTION</p>
    <h1><span class="org">真誓会大宮エリア</span>定例会 参加者リスト</h1>
  </header>

  <section class="card" id="denied" hidden>
    <h2>このページは専用URLからのみご利用いただけます。</h2>
    <p>共有されたURLを、省略せずそのまま開いてください。</p>
  </section>

  <div id="listView" hidden>
    <div class="ho-bar">
      <div class="ho-date">
        <label for="hoDate">定例会</label>
        <select id="hoDate" aria-label="定例会の日程"></select>
      </div>
      <input type="search" id="hoSearch" placeholder="名前・エリア・業種・PRで絞り込み" enterkeyhint="search" autocomplete="off" aria-label="参加者を絞り込む">
      <p class="ho-count" id="hoCount" aria-live="polite"></p>
    </div>
    <p class="notice" id="hoError" role="alert" hidden></p>
    <div class="loading" id="hoLoading" hidden><span class="spin"></span>読み込んでいます…</div>
    <p class="empty" id="hoEmpty" hidden></p>
    <ol class="ho-list" id="hoList"></ol>
    <p class="note-small">会議中の手元資料です。このページの内容とURLは、参加者以外に共有しないでください。</p>
  </div>
</main>
<button type="button" class="ho-top" id="hoTop" hidden aria-label="先頭へ戻る">↑</button>

<script src="js/config.js"></script>
<script src="js/bg.js"></script>
<script src="js/list.js"></script>
</body>
</html>
